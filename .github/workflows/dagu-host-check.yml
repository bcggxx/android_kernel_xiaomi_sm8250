name: Dagu host checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - drivers/block/zram/zram_drv.c
      - drivers/block/zram/zram_drv.h
      - tools/testing/selftests/zram/test_miui_tracking_parser.py
      - fs/f2fs/file.c
      - tools/testing/selftests/f2fs/test_seq_file_ra.py
      - mm/kshrink_slabd.c
      - mm/mi_rmap_efficiency.c
      - mm/mi_rmap_efficiency.h
      - mm/vmscan.c
      - tools/testing/selftests/vm/test_dagu_reclaim.py
      - drivers/staging/binder_prio/binder_prio.c
      - tools/testing/selftests/binder/test_graphics_priority.py
      - .github/workflows/dagu-host-check.yml
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Test actual zram parser and allocation rollback with ASan and UBSan
        env:
          SANITIZERS: address,undefined
        run: python3 tools/testing/selftests/zram/test_miui_tracking_parser.py
      - name: Test F2FS sequential readahead wrapper with ASan and UBSan
        env:
          SANITIZERS: address,undefined
        run: python3 tools/testing/selftests/f2fs/test_seq_file_ra.py
      - name: Test optional reclaim policies and concurrent submissions
        env:
          SANITIZERS: address,undefined
        run: python3 tools/testing/selftests/vm/test_dagu_reclaim.py
      - name: Test graphics Binder matching and RT permission limits
        env:
          SANITIZERS: address,undefined
        run: python3 tools/testing/selftests/binder/test_graphics_priority.py
