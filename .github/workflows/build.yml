name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code (设备代号)'
        required: true
        default: 'lmi'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      ksu:
        description: 'Enable KernelSU (ReSukiSU)'
        required: true
        type: boolean
        default: false
      target_os:
        description: 'Target OS (目标系统)'
        required: true
        type: choice
        default: 'both'
        options:
          - aosp
          - miui
          - both
      droidspaces:
        description: 'Enable DroidSpaces support'
        required: true
        type: boolean
        default: false

jobs:
  build-kernel:
    name: Build ${{ github.event.inputs.device }} | KSU:${{ github.event.inputs.ksu }} | OS:${{ github.event.inputs.target_os }} | DS:${{ github.event.inputs.droidspaces }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3
          
    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-
          ${{ runner.os }}-kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -zxvf Clang-16.0.6-20260807.tar.gz

    - name: Run Build Script
      run: |
        chmod +x build_kernel.sh
        
        ARGS="${{ github.event.inputs.device }}"
        
        if [ "${{ github.event.inputs.ksu }}" == "true" ]; then
          ARGS="$ARGS ksu"
        fi
        
        if [ "${{ github.event.inputs.target_os }}" != "both" ]; then
          ARGS="$ARGS ${{ github.event.inputs.target_os }}"
        fi

        if [ "${{ github.event.inputs.droidspaces }}" == "true" ]; then
          ARGS="$ARGS droidspaces"
        fi
        
        echo "Executing command: ./build_kernel.sh $ARGS"
        ./build_kernel.sh $ARGS

    # Shipping ZIPs retain their default configuration. Check opt-in memory
    # code in a separate output tree, using the same ARM64 toolchain.
    - name: Check opt-in memory objects (dagu)
      if: ${{ github.event.inputs.device == 'dagu' }}
      timeout-minutes: 10
      run: |
        export PATH="$HOME/zyc-clang/bin:$PATH"
        export CCACHE_DIR="$HOME/.cache/ccache_mikernel"
        kernel_mm_config=""
        for kernel_mm_candidate in out_miui/.config out_aosp/.config; do
          if [ -f "$kernel_mm_candidate" ]; then
            kernel_mm_config="$kernel_mm_candidate"
            break
          fi
        done
        test -n "$kernel_mm_config"
        mkdir -p out_dagu_mm_check
        cp "$kernel_mm_config" out_dagu_mm_check/.config
        scripts/config --file out_dagu_mm_check/.config \
          -e KSHRINK_SLABD -e MI_RMAP_EFFICIENCY
        kernel_mm_args=(O=out_dagu_mm_check ARCH=arm64 SUBARCH=arm64 \
          LLVM=1 LLVM_IAS=1 CC="ccache clang" HOSTCC="ccache clang" \
          CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-)
        make "${kernel_mm_args[@]}" olddefconfig
        grep -qx CONFIG_KSHRINK_SLABD=y out_dagu_mm_check/.config
        grep -qx CONFIG_MI_RMAP_EFFICIENCY=y out_dagu_mm_check/.config
        make "${kernel_mm_args[@]}" -j2 \
          mm/vmscan.o mm/kshrink_slabd.o mm/mi_rmap_efficiency.o

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v7
      with:
        name: APTKernel-${{ github.event.inputs.device }}-${{ github.event.inputs.target_os }}-${{ github.run_id }}
        path: APTKernel_*.zip
        compression-level: 0 # 已经被 zip 压缩过，无需再二次压缩
