name: SM8250 CI path coverage
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/ci/test_sm8250_ci_paths.py
      - run: python3 tools/ci/check_sm8250_ci_paths.py
